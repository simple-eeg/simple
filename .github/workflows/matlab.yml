name: MATLAB synthetic tests

on:
  workflow_dispatch:
    inputs:
      include_related_repositories:
        description: Also test the Oxford and Strasbourg repositories
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matlab-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: project
      - name: Check out Oxford
        if: inputs.include_related_repositories
        uses: actions/checkout@v7
        with:
          repository: simple-eeg/simple-oxford
          ref: main
          path: oxford
      - name: Check out Strasbourg
        if: inputs.include_related_repositories
        uses: actions/checkout@v7
        with:
          repository: simple-eeg/simple-strasbourg
          ref: main
          path: strasbourg
      - name: Check out EEGLAB 2026.0.0
        uses: actions/checkout@v7
        with:
          repository: sccn/eeglab
          ref: bcc710a8edd712738e48879b6846958a2be7be1d
          path: eeglab
      - name: Install the pinned EEGLAB filter plugin
        run: git -C eeglab submodule update --init plugins/firfilt
      - name: Set up the reference MATLAB environment
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026aU4
          products: >-
            Statistics_and_Machine_Learning_Toolbox
            Econometrics_Toolbox
            Signal_Processing_Toolbox
            Wavelet_Toolbox
      - name: Run the full synthetic regression suite
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            repoRoot = fullfile(getenv('GITHUB_WORKSPACE'), 'project');
            eeglabRoot = fullfile(getenv('GITHUB_WORKSPACE'), 'eeglab');
            addpath(fullfile(repoRoot, 'tests'), '-begin');
            results = run_all_tests(repoRoot, eeglabRoot);
            assert(results.passed);
            disp(jsonencode(results));
      - name: Run the Oxford suite
        if: inputs.include_related_repositories
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            repoRoot = fullfile(getenv('GITHUB_WORKSPACE'), 'oxford');
            eeglabRoot = fullfile(getenv('GITHUB_WORKSPACE'), 'eeglab');
            addpath(fullfile(repoRoot, 'tests'), '-begin');
            results = run_all_tests(repoRoot, eeglabRoot);
            assert(results.passed);
            disp(jsonencode(results));
      - name: Check Oxford source-to-raw paths
        if: inputs.include_related_repositories
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            repoRoot = fullfile(getenv('GITHUB_WORKSPACE'), 'oxford');
            addpath(fullfile(repoRoot, 'tests'), '-begin');
            run_source_path_tests(repoRoot);
      - name: Run the Strasbourg suite
        if: inputs.include_related_repositories
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            repoRoot = fullfile(getenv('GITHUB_WORKSPACE'), 'strasbourg');
            eeglabRoot = fullfile(getenv('GITHUB_WORKSPACE'), 'eeglab');
            addpath(fullfile(repoRoot, 'tests'), '-begin');
            results = run_all_tests(repoRoot, eeglabRoot);
            assert(results.passed);
            disp(jsonencode(results));
