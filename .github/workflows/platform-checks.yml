name: Platform source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check processing safety contracts
        run: python tests/check_processing_safety_contracts.py .
